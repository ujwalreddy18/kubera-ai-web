<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="KUBERA AI web edition: a bounded agent workforce that turns local business records into PPTX, DOCX and XLSX files.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>KUBERA AI</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Fira+Sans:wght@400;500;600&family=Fira+Code:wght@400;500&display=swap">
<style>
/* Layout: command workspace — sidebar rail on desktop, scrollable tab strip on phones; dense operator UI, gold reserved for money */
:root{
  --bg:#F3F5FA; --surface:#FFFFFF; --surface-2:#EBEFF8; --line:#D6DDEB; --line-strong:#B9C3DA;
  --fg:#0E1630; --muted:#5A6684; --dim:#8590AC;
  --accent:#2347D9; --accent-weak:#E2E8FF; --on-accent:#FFFFFF;
  --gold:#8F620C; --gold-weak:#FBF0D6;
  --ok:#127A4E; --ok-weak:#DDF4E9; --warn:#9A5600; --warn-weak:#FDEED7; --bad:#BE2A3A; --bad-weak:#FCE3E6;
  --shadow:0 8px 28px -12px rgba(14,22,48,.28);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Fira Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"Fira Code",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --t-pptx:#B4461A; --t-docx:#2457B8; --t-xlsx:#157043;
  --ease:cubic-bezier(.2,.7,.2,1); --dur:160ms; --tap:44px; --nav-h:64px;
  --r:10px; --r-lg:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#070B18; --surface:#0E1426; --surface-2:#151D35; --line:#222C48; --line-strong:#33405F;
  --fg:#E8ECF8; --muted:#8E99B8; --dim:#5F6A88;
  --accent:#7590FF; --accent-weak:#18234A; --on-accent:#070B18;
  --gold:#E4B556; --gold-weak:#2C2410;
  --ok:#41CE8E; --ok-weak:#0F2A20; --warn:#F2A63E; --warn-weak:#2E2010; --bad:#FF6F7D; --bad-weak:#33141A;
  --shadow:0 10px 30px -12px rgba(0,0,0,.7); --t-pptx:#F08A5D; --t-docx:#7AA7FF; --t-xlsx:#4FD18B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#070B18; --surface:#0E1426; --surface-2:#151D35; --line:#222C48; --line-strong:#33405F;
  --fg:#E8ECF8; --muted:#8E99B8; --dim:#5F6A88;
  --accent:#7590FF; --accent-weak:#18234A; --on-accent:#070B18;
  --gold:#E4B556; --gold-weak:#2C2410;
  --ok:#41CE8E; --ok-weak:#0F2A20; --warn:#F2A63E; --warn-weak:#2E2010; --bad:#FF6F7D; --bad-weak:#33141A;
  --shadow:0 10px 30px -12px rgba(0,0,0,.7); --t-pptx:#F08A5D; --t-docx:#7AA7FF; --t-xlsx:#4FD18B; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:-.01em;margin:0;text-wrap:balance}
h1{font-size:1.75rem;line-height:1.15} h2{font-size:1.15rem} h3{font-size:1rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .gold{color:var(--gold)}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}

/* shell */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;height:100vh;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:18px;padding:20px 14px;padding-left:max(14px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.coin{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:700 17px var(--f-display);color:var(--gold);background:var(--gold-weak);box-shadow:inset 0 0 0 2px var(--gold)}
.brand b{font:700 1.05rem var(--f-display);letter-spacing:.06em}
.brand small{display:block;font-size:.7rem;color:var(--muted);letter-spacing:.02em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{transition:background-color var(--dur) var(--ease),color var(--dur);display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 10px;border-radius:8px;color:var(--muted);text-decoration:none;font-weight:500;white-space:nowrap}
.nav a:hover{background:var(--surface-2);color:var(--fg)}
.nav a[aria-current="page"]{background:var(--accent-weak);color:var(--accent)}
.badge{font:500 .7rem var(--f-mono);padding:1px 7px;border-radius:99px;background:var(--surface-2);color:var(--muted)}
.nav a[aria-current="page"] .badge{background:var(--surface);color:var(--accent)}
.badge.hot{background:var(--warn-weak);color:var(--warn)}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;font-size:.8rem}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding-block:12px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.topbar .grow{flex:1;min-width:0}
.mobile-brand{display:none}
.tabs{display:none}
@media (pointer:coarse){.btn,.seg button,.tpl{min-height:var(--tap)}.cmd{min-height:var(--tap);align-items:center}}
.content{padding-block:22px 64px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px;max-width:1240px;width:100%}
.engine{max-width:100%;overflow:hidden;text-overflow:ellipsis;display:inline-flex;align-items:center;gap:8px;font-size:.82rem;color:var(--muted);padding:5px 10px;border:1px solid var(--line);border-radius:99px;background:var(--surface);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.dot.busy{background:var(--accent);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.35}}

/* controls */
.btn{transition:background-color var(--dur) var(--ease),border-color var(--dur) var(--ease),color var(--dur) var(--ease),filter var(--dur);display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line-strong);background:var(--surface);padding:8px 13px;border-radius:8px;font-weight:500;cursor:pointer;white-space:nowrap;text-decoration:none;color:var(--fg)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08);color:var(--on-accent)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--bad)} .btn.danger:hover{border-color:var(--bad)}
.btn.sm{padding:5px 9px;font-size:.82rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn[aria-busy="true"]{cursor:progress;opacity:.75}
.btn[aria-busy="true"] .ico{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ico{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav .ico{width:18px;height:18px}
.nav a .lbl{display:flex;align-items:center;gap:10px}
.icon-btn{padding:8px;min-width:36px}
.err{color:var(--bad);font-size:.8rem;font-weight:500}
[aria-invalid="true"]{border-color:var(--bad)!important;box-shadow:0 0 0 3px var(--bad-weak)}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.bottomnav{display:none}
kbd{font:500 .72rem var(--f-mono);border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--muted)}
input[type=text],input[type=number],input[type=search],select,textarea{background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:.8rem;color:var(--muted);font-weight:500}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.spacer{flex:1}

/* surfaces */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;min-width:0}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-weak);color:var(--ok)} .chip.warn{background:var(--warn-weak);color:var(--warn)}
.chip.bad{background:var(--bad-weak);color:var(--bad)} .chip.info{background:var(--accent-weak);color:var(--accent)}
.chip.gold{background:var(--gold-weak);color:var(--gold)}
.type{font:600 .7rem var(--f-mono);padding:2px 6px;border-radius:5px;letter-spacing:.04em;text-transform:uppercase;border:1px solid currentColor}
.type.pptx{color:var(--t-pptx)} .type.docx{color:var(--t-docx)} .type.xlsx{color:var(--t-xlsx)}

/* KPI strip */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.kpi{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi b{font:700 1.5rem var(--f-display);font-variant-numeric:tabular-nums;line-height:1.1}
.kpi small{color:var(--muted);font-size:.78rem}

/* composer */
.composer textarea{font-size:1.02rem;min-height:84px;border-radius:10px;padding:12px}
.templates{display:flex;gap:8px;flex-wrap:wrap}
.tpl{transition:color var(--dur),border-color var(--dur);border:1px dashed var(--line-strong);background:transparent;border-radius:99px;padding:5px 11px;font-size:.82rem;color:var(--muted);cursor:pointer}
.tpl:hover{color:var(--accent);border-color:var(--accent)}
.ai-note{font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:8px}
.switch{position:relative;display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:.85rem}
.switch input{appearance:none;width:34px;height:20px;border-radius:99px;background:var(--line-strong);position:relative;cursor:pointer;transition:background .2s;margin:0;flex:none}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:transform .2s}
.switch input:checked{background:var(--accent)} .switch input:checked::after{transform:translateX(14px)}

/* task graph */
.graph{display:grid;grid-template-columns:minmax(0,1fr) 22px minmax(0,1fr) 22px minmax(0,1fr) 22px minmax(0,1fr);align-items:center;gap:6px;overflow-x:auto}
.col{display:flex;flex-direction:column;gap:10px;min-width:0}
.arrow{color:var(--dim);text-align:center;font-family:var(--f-mono)}
.node{border:1px solid var(--line);border-radius:var(--r);padding:10px 11px;background:var(--surface);display:flex;flex-direction:column;gap:6px;min-width:0;transition:border-color .3s,box-shadow .3s}
.node.running{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak)}
.node.succeeded,.node.approved{border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.node.failed,.node.blocked{border-color:var(--bad)}
.node-top{display:flex;align-items:center;gap:8px;justify-content:space-between}
.avatar{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font:700 .72rem var(--f-mono);flex:none;color:var(--surface)}
.who{display:flex;gap:8px;align-items:center;min-width:0}
.who b{font-size:.88rem;display:block;line-height:1.2}
.who small{font-size:.72rem;color:var(--muted);display:block;line-height:1.2}
.node p{font-size:.8rem;color:var(--muted);line-height:1.4}
.progress{height:4px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .4s}
.handoffs{display:flex;gap:8px;flex-wrap:wrap}
.handoff{font:500 .75rem var(--f-mono);border:1px solid var(--line);border-radius:7px;padding:4px 8px;color:var(--muted)}
.handoff.accepted{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,var(--line))}

/* lists */
.list{display:flex;flex-direction:column}
.item{display:flex;gap:12px;align-items:center;padding:11px 2px;border-top:1px solid var(--line);min-width:0}
.item:first-child{border-top:0}
.item .body{flex:1;min-width:0}
@media (max-width:640px){.item{flex-wrap:wrap}.item .body{flex-basis:calc(100% - 80px)}}
.item .title{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .sub{font-size:.8rem;color:var(--muted)}
.feed .item{align-items:flex-start}
.tone{width:7px;height:7px;border-radius:50%;margin-top:8px;flex:none;background:var(--dim)}
.tone.success{background:var(--ok)} .tone.info{background:var(--accent)} .tone.warn{background:var(--warn)} .tone.danger{background:var(--bad)}
.empty{padding:26px 10px;text-align:center;color:var(--muted);font-size:.9rem}

/* tables */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th{text-align:left;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--surface-2);padding:9px 12px;white-space:nowrap;cursor:default}
th.sort{cursor:pointer} th.sort:hover{color:var(--accent)}
td{padding:9px 12px;border-top:1px solid var(--line);white-space:nowrap}
td.r,th.r{text-align:right}
tr:hover td{background:color-mix(in srgb,var(--surface-2) 55%,transparent)}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 12px;cursor:pointer;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent-weak);color:var(--accent)}

/* reports */
.reports{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.report{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);padding:15px;display:flex;flex-direction:column;gap:10px;min-width:0}
.report .fname{font:500 .82rem var(--f-mono);word-break:break-all}
.report ol{margin:0;padding-left:18px;font-size:.82rem;color:var(--muted)}

/* agents */
.agents{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.agent{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);padding:15px;display:flex;flex-direction:column;gap:10px}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.tool{font:.72rem var(--f-mono);padding:2px 7px;border-radius:5px;background:var(--surface-2);color:var(--muted)}
.guard{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.guard div{display:flex;gap:10px;align-items:flex-start;font-size:.86rem}
.guard i{font-style:normal;color:var(--ok);display:inline-flex;margin-top:2px}

/* chart */
.bars{display:flex;flex-direction:column;gap:9px}
.bar-row{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:.83rem}
.bar-track{height:12px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.bar-track i{display:block;height:100%;background:var(--accent);border-radius:4px}
.bar-track i.w{background:var(--gold)}

/* modal + palette + toast */
.scrim{position:fixed;inset:0;background:rgba(5,8,18,.55);display:grid;place-items:center;z-index:50;padding-block:max(20px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);width:min(640px,100%);max-height:100%;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.modal .form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal .form .full{grid-column:1/-1}
.palette{width:min(560px,100%);padding:10px;gap:6px;align-self:start;margin-top:8vh}
.palette input{font-size:1rem;padding:11px 12px}
.cmd{display:flex;justify-content:space-between;gap:10px;padding:9px 11px;border-radius:8px;cursor:pointer}
.cmd[aria-selected="true"]{background:var(--accent-weak);color:var(--accent)}
.cmd small{color:var(--muted)}
.toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:60;max-width:calc(100% - 32px)}
.toast{background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:.88rem;box-shadow:var(--shadow);animation:rise .25s ease}
@keyframes rise{from{transform:translateY(8px);opacity:.4}}
.checks{display:flex;flex-direction:column;gap:6px;font-size:.86rem}
.checks div{display:flex;gap:8px}
.notice{font-size:.84rem;border-radius:10px;padding:10px 12px;background:var(--surface-2);color:var(--muted)}
.notice.warn{background:var(--warn-weak);color:var(--warn)}

@media (max-width:1000px){.grid2{grid-template-columns:minmax(0,1fr)}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .mobile-brand{display:flex}
  .topbar{flex-wrap:wrap;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 0;gap:8px}
  .topbar{padding-block:10px}
  .bottomnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .bottomnav a,.bottomnav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:var(--nav-h);background:none;border:0;color:var(--muted);text-decoration:none;font-size:.72rem;font-weight:500;cursor:pointer;position:relative;transition:color var(--dur)}
  .bottomnav .ico{width:22px;height:22px}
  .bottomnav [aria-current="page"]{color:var(--accent)}
  .bottomnav [aria-current="page"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
  .bottomnav .pip{position:absolute;top:9px;left:calc(50% + 6px);min-width:16px;height:16px;border-radius:99px;background:var(--warn);color:var(--surface);font:600 .65rem var(--f-mono);display:grid;place-items:center;padding:0 4px}
  .toasts{bottom:calc(var(--nav-h) + 12px + env(safe-area-inset-bottom,0px))}
  .content{padding-bottom:calc(var(--nav-h) + 32px + env(safe-area-inset-bottom,0px))!important}
  .btn,.seg button,.tpl,select,input[type=text],input[type=number],input[type=search]{min-height:var(--tap)}
  .btn.sm{padding:8px 12px;font-size:.86rem}
  .switch{min-height:var(--tap)}
  .theme-lbl,.search-lbl{display:none}
  .cards table,.cards tbody,.cards tr,.cards td{display:block;width:100%}
  .cards thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .cards tr{border-top:1px solid var(--line);padding:10px 12px;display:grid;grid-template-columns:1fr 1fr;gap:4px 12px}
  .cards tr:first-child{border-top:0}
  .cards td{border:0;padding:0;white-space:normal;text-align:left!important;min-width:0}

      { id:'e2', at:ago(129), kind:'create_file', tone:'info', text:'W-2 wrote acme-corp_q3-pipeline-deck.pptx to the Report Center.' },
      { id:'e3', at:ago(131), kind:'consume_handoff', tone:'info', text:'W-2 consumed market_analysis and pipeline_metrics handoffs.' },

function seedReport(st) {

  const c = buildContent(st, m, null);
  st.reports.push({ id:'r-seed', missionId:m.id, name:fileName(m.title,'pptx', st.missions[0].createdAt), type:'pptx', createdAt:m.updatedAt,
    size:null, producer:'W-2', approval:'approved', feedback:'', content:c, outline:outlineFor('pptx', c), checks:null, sources:c.sourceIds });
}

let S;
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

/* ---------- formatting ---------- */
const money = (v, compact) => new Intl.NumberFormat(S.settings.currency === 'INR' ? 'en-IN' : 'en-US',
  { style:'currency', currency:S.settings.currency, maximumFractionDigits: compact ? 1 : 0, notation: compact ? 'compact' : 'standard' }).format(v || 0);
const ago = ts => { if (!ts) return '—'; const d = (now() - ts) / 1000; const f = Math.abs(d);
  const s = f < 60 ? Math.round(f) + 's' : f < 3600 ? Math.round(f/60) + 'm' : f < 86400 ? Math.round(f/3600) + 'h' : Math.round(f/86400) + 'd';
  return d >= 0 ? s + ' ago' : 'in ' + s; };
const when = ts => ts ? new Date(ts).toLocaleString(undefined, { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' }) : '—';
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,48);
const fileName = (title, type, ts) => `${slug(title)}_${new Date(ts || now()).toISOString().slice(0,10)}.${type}`;
const clientName = id => S.clients.find(c => c.id === id)?.name || 'Unknown client';
const agent = id => S.agents.find(a => a.id === id);
const bytes = n => n == null ? '' : n < 1024 ? n + ' B' : n < 1048576 ? (n/1024).toFixed(1) + ' KB' : (n/1048576).toFixed(2) + ' MB';
const ico = (n, cls = 'ico') => `<svg class="${cls}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
function setErr(input, msg) { const id = input.id + '-err'; let e = document.getElementById(id); if (!msg) { input.removeAttribute('aria-invalid'); input.removeAttribute('aria-describedby'); e && e.remove(); return false; } if (!e) { e = document.createElement('p'); e.id = id; e.className = 'err'; (input.closest('.field') || input.parentElement).appendChild(e); } e.textContent = msg; input.setAttribute('aria-invalid', 'true'); input.setAttribute('aria-describedby', id); input.focus(); return true; }
const clearErrOnInput = el => $$('input,textarea,select', el).forEach(i => i.addEventListener('input', () => i.getAttribute('aria-invalid') && setErr(i, null)));
async function busy(btn, label, fn) { if (!btn || btn.getAttribute('aria-busy') === 'true') return; const html = btn.innerHTML; btn.setAttribute('aria-busy', 'true'); btn.disabled = true; btn.innerHTML = ico('loader') + label; try { await fn(); } finally { btn.removeAttribute('aria-busy'); btn.disabled = false; btn.innerHTML = html; } }
const initials = n => n.replace(/[^A-Za-z0-9]/g,'').slice(0,2).toUpperCase();

/* ---------- capabilities ---------- */
let DL = null, AI = null;
if (window.claude?.use) {
  claude.use('downloads').then(d => { DL = d; refresh(); }).catch(() => {});
  claude.use('sample').then(s => { AI = s; refresh(); }).catch(() => {});
}
async function offerFile(name, blob) {

}

/* ---------- toast / activity ---------- */
function toast(msg) { const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg; $('#toasts').appendChild(el); setTimeout(() => el.remove(), 3400); }
function log(kind, tone, text, missionId) { S.activity.unshift({ id:uid('e'), at:now(), kind, tone, text, missionId }); if (S.activity.length > 400) S.activity.length = 400; }

/* ---------- analytics (local, deterministic) ---------- */
function metricsFor(projects) {
  const live = projects.filter(p => p.stage !== 'Closed Lost');
  const total = live.reduce((a, p) => a + p.value, 0);
  const weighted = projects.reduce((a, p) => a + p.value * (WIN[p.stage] ?? 0), 0);
  const byStage = STAGES.map(s => ({ stage:s, value:projects.filter(p => p.stage === s).reduce((a,p) => a + p.value, 0), count:projects.filter(p => p.stage === s).length }));
  const risk = projects.filter(p => p.risk && !p.stage.startsWith('Closed'));
  const open = projects.filter(p => !p.stage.startsWith('Closed')).sort((a,b) => b.value - a.value);
  const byClient = {}; live.forEach(p => byClient[p.clientId] = (byClient[p.clientId] || 0) + p.value);
  const topClient = Object.entries(byClient).sort((a,b) => b[1] - a[1])[0];
  return { total, weighted, byStage, risk, riskValue:risk.reduce((a,p)=>a+p.value,0), open, count:projects.length, won:byStage[3].value,
    avg: live.length ? total / live.length : 0, topClient: topClient ? { name:clientName(topClient[0]), value:topClient[1], share: total ? topClient[1]/total : 0 } : null };
}

/* ---------- mission parsing ---------- */
function detectType(text) {
  const t = text.toLowerCase();
  if (/\b(sheet|spreadsheet|excel|xlsx|workbook|table|tracker)\b/.test(t)) return 'xlsx';
  if (/\b(report|memo|docx|word|brief|letter|summary document|proposal doc)\b/.test(t)) return 'docx';
  return 'pptx';
}
function detectClients(text) {
  const t = text.toLowerCase();
  const hit = S.clients.filter(c => t.includes(c.name.toLowerCase()) || t.includes(c.name.split(' ')[0].toLowerCase()));
  return hit.map(c => c.id);
}
function titleFrom(text, type, clientIds) {
  const scope = clientIds.length === 1 ? clientName(clientIds[0]) : clientIds.length ? clientIds.length + '-client' : 'Portfolio';
  const q = (text.match(/\bQ[1-4]\b/i) || [''])[0].toUpperCase();
  const noun = { pptx:'pipeline deck', docx:'account report', xlsx:'pipeline workbook' }[type];
  return [scope, q, noun].filter(Boolean).join(' ');
}

/* ---------- content ---------- */
function buildContent(st, m, ai) {
  const ids = m.clientIds.length ? m.clientIds : st.clients.map(c => c.id);
  const projects = st.projects.filter(p => ids.includes(p.clientId));
  const k = metricsFor(projects);
  const scope = m.clientIds.length === 1 ? clientName(m.clientIds[0]) : m.clientIds.length ? m.clientIds.map(clientName).join(', ') : 'All clients';
  const findings = [
    `Weighted pipeline is ${money(k.weighted)}, ${k.total ? Math.round(k.weighted / k.total * 100) : 0}% of the ${money(k.total)} gross pipeline.`,
    k.risk.length ? `${k.risk.length} at-risk project${k.risk.length>1?'s':''} worth ${money(k.riskValue)}: ${k.risk.map(p=>p.name).join(', ')}.` : 'No open projects are flagged at risk.',
    k.open[0] ? `Largest open opportunity is ${k.open[0].name} (${clientName(k.open[0].clientId)}) at ${money(k.open[0].value)}.` : 'No open opportunities in scope.'
  ];
  if (k.topClient && ids.length > 1) findings.push(`${k.topClient.name} holds ${Math.round(k.topClient.share*100)}% of live pipeline, a concentration to watch.`);
  const actions = [
    k.risk[0] ? `Assign a recovery owner to ${k.risk[0].name} this week and confirm a decision date.` : 'Keep weekly risk review in place to catch slippage early.',
    k.byStage[1].count ? `Push ${k.byStage[1].count} Proposal-stage deal${k.byStage[1].count>1?'s':''} (${money(k.byStage[1].value)}) toward Negotiation with pricing sign-off.` : 'Build proposal coverage; no deals sit in Proposal.',
    k.byStage[0].count ? `Qualify ${k.byStage[0].count} Discovery project${k.byStage[0].count>1?'s':''} or close them out by month end.` : 'Refill top of funnel; Discovery is empty.'
  ];
  return {
    title: m.title, prompt: m.text, scope, createdAt: m.updatedAt || now(),
    headline: ai?.headline || `${scope}: ${money(k.total)} live pipeline, ${money(k.weighted)} weighted`,
    summary: ai?.summary || `${scope} carries ${money(k.total)} in live pipeline across ${k.count} project${k.count===1?'':'s'}. Probability-weighted value is ${money(k.weighted)}. ${k.risk.length ? k.risk.length + ' project' + (k.risk.length>1?'s are':' is') + ' flagged at risk.' : 'Nothing is flagged at risk.'}`,
    findings: ai?.findings?.length ? ai.findings.slice(0,4) : findings,
    actions: ai?.actions?.length ? ai.actions.slice(0,4) : actions,
    aiWritten: !!ai,
    metrics: { total:k.total, weighted:k.weighted, riskValue:k.riskValue, avg:k.avg, won:k.won, count:k.count },
    byStage: k.byStage,
    rows: projects.map(p => ({ id:p.id, name:p.name, client:clientName(p.clientId), stage:p.stage, value:p.value, risk:p.risk, prob:WIN[p.stage] })),
    sourceIds: projects.map(p => p.id).concat(ids),
    currency: st.settings.currency
  };
}
function outlineFor(type, c) {
  if (type === 'pptx') return ['Title — ' + c.title, 'Executive overview', 'Pipeline by stage', 'Open opportunities', 'Findings and risks', 'Recommended actions'];
  if (type === 'docx') return ['Executive summary', 'Key metrics', 'Findings', 'Project detail', 'Recommended actions', 'Provenance'];
  return ['Summary sheet', 'Projects (with SUM formulas)', 'By stage (SUMIF formulas)', 'Actions'];

/* ---------- Office writers ---------- */
async function buildFile(type, c) {
  if (type === 'pptx') return buildPptx(c);
  if (type === 'docx') return buildDocx(c);
  return buildXlsx(c);
}
const fmtMoney = (v, cur) => new Intl.NumberFormat(cur === 'INR' ? 'en-IN' : 'en-US', { style:'currency', currency:cur, maximumFractionDigits:0 }).format(v);
async function buildPptx(c) {

function createMission(text, opts = {}) {

function pump() { if (running || !queue.length) return; const id = queue.shift(); const m = S.missions.find(x => x.id === id); if (!m || m.status !== 'queued') return pump(); running = id; runMission(m).finally(() => { running = null; save(); refresh(); pump(); }); }

async function runMission(m) {
  m.status = 'running'; m.updatedAt = now(); m.cancel = false;

  m.tasks = [ mk('manager','manager','Plan a bounded delivery team') ];
  refresh();
  const T = k => m.tasks.find(t => t.key === k);
  const start = t => { t.status = 'running'; load[t.agentId] = (load[t.agentId]||0) + 1; refresh(); };
  const end = (t, st, summary) => { t.status = st; t.summary = summary; load[t.agentId] = Math.max(0, (load[t.agentId]||1) - 1); m.updatedAt = now(); save(); refresh(); };
  const scopeIds = m.clientIds.length ? m.clientIds : S.clients.map(c => c.id);
  const projects = S.projects.filter(p => scopeIds.includes(p.clientId));
  try {

    m.tasks.push(mk('market','market','Assess opportunity and risk'), mk('ops','ops','Prepare pipeline metrics'),

    const names = m.tasks.slice(1).map(t => agent(t.agentId).name);

    const mt = T('market'), ot = T('ops'); start(mt); start(ot);

    let aiOut = null;

            totals:{ live:k.total, weighted:Math.round(k.weighted), atRisk:k.riskValue, won:k.won },
            projects: projects.map(p => ({ name:p.name, client:clientName(p.clientId), stage:p.stage, value:p.value, atRisk:p.risk })) };
          aiOut = await AI.json(`You are Maya, a market analyst inside KUBERA AI. Using ONLY the JSON data below, write narrative for a ${m.type.toUpperCase()} deliverable. Do not invent numbers; quote figures exactly as given (format money in ${S.settings.currency}). Return JSON: {"headline": string under 90 chars, "summary": 2-3 sentences, "findings": [3 short strings], "actions": [3 short imperative strings]}.\n\nDATA:\n${JSON.stringify(data)}`, { modelTier:'default' });
          if (!aiOut || !Array.isArray(aiOut.findings)) aiOut = null;
        } catch (e) { aiOut = null; log('ai_fallback', 'warn', `Claude narrative unavailable (${e?.code || 'error'}); Maya used the deterministic analyst.`, m.id); }
      }

      const k = metricsFor(projects);
      end(mt, 'succeeded', aiOut ? `Claude drafted ${aiOut.findings.length} findings from ${projects.length} records.` : `Flagged ${k.risk.length} at-risk project${k.risk.length===1?'':'s'} and ${Math.min(3, k.open.length)} themes.`);

      end(ot, 'succeeded', `Reconciled ${money(k.total)} live, ${money(k.weighted)} weighted across ${projects.length} projects.`);
      m.handoffs.push({ type:'pipeline_metrics', from:agent(ot.agentId).name, sources:projects.length, status:'accepted' }); refresh();

    m.updatedAt = now();

    await wait(900, m);
    const rep = { id:uid('r'), missionId:m.id, name:fileName(m.title, m.type), type:m.type, createdAt:now(), size:blob.size, producer:agent(dt.agentId).name,
      approval:'pending', feedback:'', content, outline:outlineFor(m.type, content), checks:null, sources:content.sourceIds };
    end(dt, 'succeeded', `Wrote ${rep.name} (${bytes(blob.size)}).`);

    const rv = T('review'); start(rv); await wait(800, m);
    const part = blob.slice(0, 2); const head = new Uint8Array(part.arrayBuffer ? await part.arrayBuffer() : await new Promise(res => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.readAsArrayBuffer(part); }));
    const checks = [
      { label:'Valid Office package (ZIP header)', ok: head[0] === 0x50 && head[1] === 0x4B },

  }

}

function field(f, lo, hi) {
  const out = new Set();
  for (const part of f.split(',')) {
    let [r, st] = part.split('/'); st = st ? +st : 1; let a, b;
    if (r === '*') { a = lo; b = hi; } else if (r.includes('-')) { [a, b] = r.split('-').map(Number); } else { a = +r; b = st > 1 ? hi : a; }
    if ([a, b, st].some(Number.isNaN) || a < lo || b > hi || st < 1) throw new Error('bad');
    for (let i = a; i <= b; i += st) out.add(i);
  }
  return out;
}
function nextRun(cron, from = now()) {
  try {
    const p = cron.trim().split(/\s+/); if (p.length !== 5) return null;
    const [mi, ho, dm, mo, dw] = [field(p[0],0,59), field(p[1],0,23), field(p[2],1,31), field(p[3],1,12), field(p[4],0,7)];
    if (dw.has(7)) dw.add(0);
    const dmAny = p[2] === '*', dwAny = p[4] === '*';
    const d = new Date(from); d.setSeconds(0, 0); d.setMinutes(d.getMinutes() + 1);
    for (let i = 0; i < 200000; i++) {
      if (!mo.has(d.getMonth() + 1)) { d.setMonth(d.getMonth() + 1, 1); d.setHours(0, 0); continue; }
      const dayOk = dmAny && dwAny ? true : dmAny ? dw.has(d.getDay()) : dwAny ? dm.has(d.getDate()) : (dm.has(d.getDate()) || dw.has(d.getDay()));
      if (!dayOk) { d.setDate(d.getDate() + 1); d.setHours(0, 0); continue; }
      if (!ho.has(d.getHours())) { d.setHours(d.getHours() + 1, 0); continue; }
      if (!mi.has(d.getMinutes())) { d.setMinutes(d.getMinutes() + 1); continue; }
      return d.getTime();
    }
  } catch (e) {}
  return null;
}
function describeCron(c) {
  const p = c.trim().split(/\s+/); if (p.length !== 5) return 'Invalid';
  const t = /^\d+$/.test(p[0]) && /^\d+$/.test(p[1]) ? `${String(p[1]).padStart(2,'0')}:${String(p[0]).padStart(2,'0')}` : null;
  const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  if (t && p[2] === '*' && p[3] === '*' && p[4] === '*') return `Daily at ${t}`;
  if (t && p[2] === '*' && p[3] === '*' && /^[0-7]$/.test(p[4])) return `Every ${days[+p[4] % 7]} at ${t}`;
  if (t && p[2] === '*' && p[3] === '*' && p[4] === '1-5') return `Weekdays at ${t}`;
  if (t && /^\d+$/.test(p[2]) && p[3] === '*' && p[4] === '*') return `Monthly on day ${p[2]} at ${t}`;
  return 'Custom schedule';
}

function graphHTML(m) {
  if (!m) return `<div class="empty">No mission yet. Describe a goal above and press Run mission.</div>`;

  const node = t => { if (!t) return `<div class="node"><p>Waiting for the manager's plan…</p></div>`; const a = agent(t.agentId);
    return `<div class="node ${t.status}"><div class="node-top"><div class="who">${av(a)}<div><b>${esc(a.name)}</b><small>${esc(a.role)}</small></div></div>${statusChip(t.status)}</div><p><b style="color:var(--fg);font-weight:500">${esc(t.title)}</b><br>${esc(t.summary || (t.status==='running' ? 'Working…' : 'Queued behind its dependencies.'))}</p></div>`; };
  const done = m.tasks.filter(t => ['succeeded','approved'].includes(t.status)).length;
  const pct = m.status === 'done' ? 100 : Math.round(done / 5 * 100);
  const rep = m.reportId && S.reports.find(r => r.id === m.reportId);
  return `<div class="panel-head"><div style="min-width:0"><span class="label">${m.source==='schedule'?'Scheduled mission':'Mission'} · ${esc(when(m.createdAt))}${m.ai?' · Claude narrative':''}</span><h2>${esc(m.title)}</h2><p class="muted" style="font-size:.88rem">“${esc(m.text)}”</p></div>

    <div class="progress" style="margin-bottom:14px"><i style="width:${pct}%"></i></div>
    <div class="graph">
      <div class="col">${node(T('manager'))}</div><div class="arrow">→</div>
      <div class="col">${node(T('market'))}${node(T('ops'))}</div><div class="arrow">→</div>
      <div class="col">${node(T('doc'))}</div><div class="arrow">→</div>

    <div class="row" style="margin-top:14px"><span class="label">Handoffs</span><div class="handoffs">${m.handoffs.length ? m.handoffs.map(h => `<span class="handoff ${h.status}">${esc(h.type)} · ${esc(h.from)} · ${h.sources} src</span>`).join('') : '<span class="muted" style="font-size:.82rem">None yet</span>'}</div></div>`;

/* ---------- modal ---------- */
let lastFocus = null;
function modal(html, onMount) {
  if (!$('#layer').innerHTML) lastFocus = document.activeElement;
  $('#layer').innerHTML = `<div class="scrim" id="scrim"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  const sc = $('#scrim'), dlg = $('.modal', sc), h = $('h2', dlg);
  if (h) { h.id = h.id || 'dlgTitle'; dlg.setAttribute('aria-labelledby', h.id); } else dlg.setAttribute('aria-label', 'Command menu');
  sc.addEventListener('click', e => { if (e.target === sc) closeModal(); });
  dlg.addEventListener('keydown', e => { if (e.key !== 'Tab') return; const f = $$('a[href],button:not([disabled]),input,select,textarea', dlg).filter(x => !x.closest('[hidden]')); if (!f.length) return;

function parseCSV(text) {
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) { const ch = text[i];
    if (q) { if (ch === '"' && text[i+1] === '"') { cur += '"'; i++; } else if (ch === '"') q = false; else cur += ch; }
    else if (ch === '"') q = true; else if (ch === ',') { row.push(cur); cur = ''; } else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i+1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; } else cur += ch; }
  if (cur || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim()));
}

function palette() {
  const cmds = [
    ...ROUTES.map(([id, l]) => ({ l:'Go to ' + l, k:'Navigate', run:() => go(id) })),
    ...TEMPLATES.map(t => ({ l:'Run: ' + t, k:'Mission', run:() => { createMission(t); go('missions'); } })),
    { l:'Add project', k:'Records', run:() => { go('records'); setTimeout(() => projectForm(), 50); } },
    { l:'Add client', k:'Records', run:() => { recTab = 'clients'; go('records'); setTimeout(() => clientForm(), 50); } },
    { l:'Import projects from CSV', k:'Records', run:() => { go('records'); setTimeout(importForm, 50); } },
    { l:'New schedule', k:'Schedules', run:() => { go('schedules'); setTimeout(schedForm, 50); } },
    { l:'Switch theme', k:'Workspace', run:cycleTheme },
    { l:'Back up workspace', k:'Workspace', run:backup },
    ...S.reports.slice(0, 8).map(r => ({ l:'Open ' + r.name, k:'Report', run:() => { go('reports'); setTimeout(() => previewReport(r.id), 50); } }))
  ];
  let sel = 0, shown = cmds;
  modal(`<input type="search" id="pq" placeholder="Type a command or a mission goal" aria-label="Command"><div id="pl" role="listbox"></div>`, el => {
    el.classList.add('palette');
    const draw = () => { const q = $('#pq', el).value.trim().toLowerCase();
      shown = cmds.filter(c => c.l.toLowerCase().includes(q));
      if (q.length > 8) shown.push({ l:`Run mission: "${$('#pq', el).value.trim()}"`, k:'New', run:() => { createMission($('#pq', el).value); go('missions'); } });
      sel = Math.min(sel, Math.max(0, shown.length - 1));
      $('#pl', el).innerHTML = shown.slice(0, 12).map((c, i) => `<div class="cmd" role="option" data-i="${i}" aria-selected="${i===sel}"><span>${esc(c.l)}</span><small>${esc(c.k)}</small></div>`).join('') || '<div class="empty">No matching command</div>'; };
    const exec = i => { const c = shown[i]; if (!c) return; closeModal(); c.run(); };
    $('#pq', el).oninput = () => { sel = 0; draw(); };
    $('#pq', el).onkeydown = e => { if (e.key === 'ArrowDown') { sel = Math.min(sel + 1, Math.min(shown.length, 12) - 1); draw(); e.preventDefault(); } else if (e.key === 'ArrowUp') { sel = Math.max(0, sel - 1); draw(); e.preventDefault(); } else if (e.key === 'Enter') { exec(sel); e.preventDefault(); } };
    $('#pl', el).onclick = e => { const c = e.target.closest('.cmd'); if (c) exec(+c.dataset.i); };
    draw();
  });
}

  else if (act === 'editclient') clientForm(S.clients.find(c => c.id === id));
  else if (act === 'import') importForm();
  else if (act === 'export') { const rows = [['name','client','stage','value','risk'], ...S.projects.map(p => [p.name, clientName(p.clientId), p.stage, p.value, p.risk?'yes':'no'])]; offerFile(`kubera-projects_${new Date().toISOString().slice(0,10)}.csv`, new Blob([rows.map(r => r.map(csvCell).join(',')).join('\n')], { type:'text/csv' })); }
  else if (act === 'newsched') schedForm();
  else if (act === 'runsched') { const s = S.schedules.find(x => x.id === id); s.lastRun = now(); createMission(s.prompt, { type:s.type, source:'schedule' }); save(); go('missions'); }
  else if (act === 'delsched') { if (b.dataset.armed) { S.schedules = S.schedules.filter(x => x.id !== id); save(); render(); toast('Schedule deleted'); } else { b.dataset.armed = 1; b.classList.remove('icon-btn'); b.innerHTML = ico('trash') + 'Confirm'; } }
  else if (act === 'exportlog') offerFile(`kubera-audit_${new Date().toISOString().slice(0,10)}.json`, new Blob([JSON.stringify(S.activity, null, 2)], { type:'application/json' }));
  else if (act === 'backup') backup();
  else if (act === 'restore') {
    modal(`<h2>Restore from backup</h2><p class="muted" style="font-size:.88rem">This replaces everything in this browser with the backup file.</p><label class="field"><span>Backup file (.json)</span><input type="file" id="rsFile" accept=".json,application/json"></label><div class="row end"><button class="btn" type="button" id="rsCancel">Cancel</button></div>`, el => {
      $('#rsCancel', el).onclick = closeModal;
      $('#rsFile', el).onchange = ev => { const f = ev.target.files[0]; if (!f) return; const fr = new FileReader(); fr.onload = () => { try { const d = JSON.parse(fr.result); if (d.version !== 2 || !Array.isArray(d.projects)) throw 0; S = d; save(); closeModal(); render(); toast('Workspace restored'); } catch (x) { toast('That file is not a KUBERA workspace backup'); } }; fr.readAsText(f); };
    });
  }
  else if (act === 'reset') { if (b.dataset.armed) { S = seed(); seedReport(S); queue.length = 0; save(); render(); toast('Demo data restored'); } else { b.dataset.armed = 1; b.textContent = 'Tap again to reset everything'; } }
});

render();
setInterval(() => { if (route === 'missions' && !running) { const k = $('#history'); if (k) k.innerHTML = historyHTML(); } else if (route === 'schedules' && !$('#layer').innerHTML) render(); }, 30000);
})();
</script>

</body>
</html>
